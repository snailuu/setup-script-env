name: CI

on:
  push:
  pull_request:

jobs:
  bash-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n install.sh scripts/setup-go.sh scripts/setup-python.sh scripts/setup-rust.sh

  smoke-macos:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel] # macos-latest=15/arm64, macos-15-intel=x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install all (non-interactive)
        env:
          TERM: xterm-256color
        run: |
          { printf 'all\nY\n'; yes '' | head -n 20; } | bash install.sh

      - name: Verify tools
        shell: bash
        run: |
          set +u
          source "$HOME/.gvm/scripts/gvm"
          go version
          uv --version
          rustc --version
