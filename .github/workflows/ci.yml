name: CI

on:
  push:
  pull_request:

jobs:
  bash-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n install.sh scripts/setup-go.sh scripts/setup-python.sh scripts/setup-rust.sh

  smoke-macos:
    strategy:
      matrix:
        os: [macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Non-interactive smoke test (exit via q)
        run: |
          printf 'q\n' | bash install.sh
