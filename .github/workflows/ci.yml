name: CI

on:
  push:
  pull_request:

jobs:
  bash-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n install.sh scripts/setup-go.sh scripts/setup-python.sh scripts/setup-rust.sh

  smoke-macos:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel] # macos-latest=15/arm64, macos-15-intel=x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install all (non-interactive)
        env:
          TERM: xterm-256color
        run: |
          { printf 'all\nY\n'; yes '' | head -n 20; } | bash install.sh

      - name: Verify tools
        shell: bash
        run: |
          set +e
          set +u 2>/dev/null || true

          export GVM_NO_GIT_BAK=${GVM_NO_GIT_BAK:-0}
          export GVM_DEBUG=${GVM_DEBUG:-0}

          if [[ ! -s "$HOME/.gvm/scripts/gvm" ]]; then
            echo "gvm not found at $HOME/.gvm/scripts/gvm"
            exit 1
          fi

          source "$HOME/.gvm/scripts/gvm" || true

          # Ensure a gvm-managed Go exists for the verify step
          if ! gvm list | grep -q "go1.23.4"; then
            gvm install go1.23.4 -B || { echo "gvm install failed"; exit 1; }
          fi
          gvm use go1.23.4 --default || { echo "gvm use failed"; exit 1; }

          export PATH="$HOME/.local/bin:$PATH"
          [[ -f "$HOME/.cargo/env" ]] && source "$HOME/.cargo/env"

          command -v go >/dev/null && go version || { echo "go not found"; exit 1; }
          command -v uv >/dev/null && uv --version || { echo "uv not found"; exit 1; }
          command -v rustc >/dev/null && rustc --version || { echo "rustc not found"; exit 1; }
